services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modaco
      POSTGRES_PASSWORD: modaco
      POSTGRES_DB: modaco
    ports:
      - "5434:5432"
    volumes:
      - modaco_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modaco -d modaco"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  modaco_pg:
